<style>

.log p{margin:6px 0;display:flex;gap:10px;align-items:flex-start}.log svg{flex:none}.ban{border-radius:4px;margin-bottom:12px;display:block;width:100%;height:auto}.cast{display:flex;gap:10px;flex-wrap:wrap;margin:14px 0}.cast div{flex:1 1 200px;background:var(--panel2);border-radius:6px;padding:10px;display:flex;gap:10px;align-items:center;font-size:.92rem}.cast svg{flex:none}
.who{font-weight:500}
.c{color:var(--acc)}.r{color:var(--cool)}
.big{font:700 1.5rem 'Barlow Condensed',monospace;letter-spacing:.1em}
.ok{color:var(--ok)}.bad{color:var(--bad)}

@keyframes fl{0%,100%{opacity:1}46%{opacity:1}48%{opacity:.2}50%{opacity:1}52%{opacity:.3}54%{opacity:1}}

body{background-image:linear-gradient(color-mix(in srgb,var(--ink) 6%,transparent) 1px,transparent 1px),linear-gradient(90deg,color-mix(in srgb,var(--ink) 6%,transparent) 1px,transparent 1px);background-size:32px 32px}
.top{border-top:5px solid var(--acc);border-image:repeating-linear-gradient(135deg,var(--acc) 0 10px,#111 10px 20px) 5 0 0 0}
.bar{height:6px;background:var(--panel2);border-radius:3px;margin-top:8px;overflow:hidden}.bar i{display:block;height:100%;width:100%;background:var(--cool);transition:width 1s linear}.bar.low i{background:var(--bad)}
.stage{box-shadow:0 8px 24px rgba(0,0,0,.18)}.stage h2{border-left:4px solid var(--acc);padding-left:10px;margin-bottom:8px}
.log p>span{background:var(--panel2);padding:6px 12px;border-radius:2px 10px 10px 10px}
.kp{display:grid;grid-template-columns:repeat(3,64px);gap:6px;margin:8px 0}.kp button{font:700 1.3rem 'Barlow Condensed',sans-serif;padding:.4em 0}
.timer{font-family:Orbitron,sans-serif;font-size:1.5rem;text-shadow:0 0 10px var(--cool)}.big{font-family:Orbitron,monospace;font-size:1.15rem}.kp button{font-family:Orbitron,sans-serif;font-size:1rem}
.top h1{font-size:1.05rem!important}.stage h2{font-size:1.3rem}.stage h1{font-size:clamp(1.4rem,5vw,2.2rem)!important;text-shadow:0 0 18px color-mix(in srgb,var(--acc) 60%,transparent)}
body::after{content:'';position:fixed;inset:0;pointer-events:none;background:repeating-linear-gradient(0deg,rgba(0,0,0,.07) 0 1px,transparent 1px 3px);z-index:5}
.top,.stage,.log{box-shadow:0 0 18px color-mix(in srgb,var(--cool) 22%,transparent),inset 0 0 30px color-mix(in srgb,var(--cool) 6%,transparent);border-color:color-mix(in srgb,var(--cool) 55%,var(--line))}
button{transition:box-shadow .15s,transform .15s}button:hover:not(:disabled){box-shadow:0 0 12px var(--cool);transform:translateY(-1px)}button.go{box-shadow:0 0 14px color-mix(in srgb,var(--acc) 55%,transparent)}
.slot{font-size:1rem;border-style:solid;border-color:var(--line)}.slot.on{box-shadow:0 0 14px var(--acc);animation:pop .6s}
@keyframes pop{0%{transform:scale(.4)}60%{transform:scale(1.35)}100%{transform:scale(1)}}

body{background-color:var(--bg);background-image:radial-gradient(60% 40% at 12% 0%,color-mix(in srgb,var(--cool) 16%,transparent),transparent),radial-gradient(50% 40% at 92% 100%,color-mix(in srgb,var(--acc) 12%,transparent),transparent),linear-gradient(color-mix(in srgb,var(--ink) 6%,transparent) 1px,transparent 1px),linear-gradient(90deg,color-mix(in srgb,var(--ink) 6%,transparent) 1px,transparent 1px);background-size:auto,auto,32px 32px,32px 32px;background-attachment:fixed}
.ban{height:110px;border:1px solid var(--line)}
.stage{position:relative}.stage::before,.stage::after{content:'';position:absolute;width:20px;height:20px;border:2px solid var(--cool);pointer-events:none}.stage::before{top:-2px;left:-2px;border-right:0;border-bottom:0}.stage::after{bottom:-2px;right:-2px;border-left:0;border-top:0}

.stage h1{text-align:center}

button,input{font-family:Orbitron,Barlow,sans-serif;font-size:.8rem;letter-spacing:.03em}

.wl,.wr{cursor:pointer}.wl:hover,.wr:hover{filter:brightness(1.25)}

 hud();go('hall');[400,600,800].forEach((f,i)=>setTimeout(()=>beep(f,.1,'sine'),i*120));

   if(S.in.length===4){S.lock=true;give('cristal','A calibração foi aceita e o painel se abriu.')}})}
 if(r==='sec'&&!BONUS){const L=[...document.querySelectorAll('.wl')],R2=[...document.querySelectorAll('.wr')];const cl=()=>{S.l=null;L.forEach(x=>x.setAttribute('stroke','none'))};L.forEach(l=>l.onclick=()=>{if(S.ok.includes(+l.dataset.i))return;S.l=+l.dataset.i;L.forEach(x=>x.setAttribute('stroke',x===l?'#fff':'none'));beep(500,.05)});R2.forEach((c,j)=>c.onclick=()=>{if(S.l===null||S.ok.includes(+c.dataset.c))return;if(+c.dataset.c===S.l){S.ok.push(S.l);$('#wr').insertAdjacentHTML('afterbegin',`<line x1='45' y1='${30+S.l*46}' x2='255' y2='${30+j*46}' stroke='${CL[S.l]}' stroke-width='6' stroke-linecap='round'/>`);cl();beep(700,.08,'sine');fb(`${S.ok.length} de 4 fios ligados.`);if(S.ok.length===4)bonus()}else{beep(150,.25);cl();fb('<span class="bad">Cor errada. Tente de novo.</span>')}})}
 if(r==='maq'&&!S.done){document.querySelectorAll('[data-p]').forEach(b=>b.onclick=()=>{if(b.dataset.p===ORDEM[S.i]){S.i++;ASM=S.i;b.disabled=true;beep(500+S.i*60,.12,'sine');fb(`Peças montadas: ${S.i} de 5`);
   if(S.i===5){S.done=true;beep(700,.2,'sine');$('#st').innerHTML=`<h2>Sala da Máquina</h2><p>Todas as peças estão no lugar. Uma luz âmbar pisca no painel. Falta só puxar a alavanca principal.</p><button class="go" id="lv">Ligar a máquina</button>`;say('Tico','Montagem concluída. Pode ligar!','h');$('#lv').onclick=()=>end(true)}}
   else{T=Math.max(1,T-15);beep(150,.3);say('Tico','Encaixe errado! Perdemos 15 segundos. Confira o esquema na parede.','w')}})}}
function end(win){over=true;clearInterval(tick);document.body.classList.remove('alert','out');hud();const s=1+(T>=TOT/2)+(H<=1)+(E<=3);const pts=Math.round(Math.max(0,5000+T*10-E*150-H*200+(BONUS?1500:0))*(TOT===420?1.3:TOT===720?.8:1));const rk=pts>8500?'Engenheiro(a) Lendário(a)':pts>6500?'Especialista':'Aprendiz de laboratório';const ach=[E===0&&'Sem erros',H===0&&'Sem dicas',T>=TOT*.6&&'Velocista',BONUS&&'Caçador de segredos'].filter(Boolean);let rec=pts,top=[];if(win)try{top=JSON.parse(localStorage.getItem('lab-top')||'[]');top.push({n:NOME,p:pts});top.sort((a,b)=>b.p-a.p);top=top.slice(0,3);localStorage.setItem('lab-top',JSON.stringify(top));rec=top[0].p}catch(e){}
 $('#app').innerHTML=win?`<div class="stage hero" style="margin-top:20px">${rx()}<h1 style="font-size:2.6rem">A máquina voltou a funcionar</h1><p>As luzes sobem em sequência, os motores aceleram e o painel estabiliza. Você terminou com <strong>${fmt(T)}</strong> de sobra.</p><p class="big" style="color:var(--acc)">${'★'.repeat(s)}${'☆'.repeat(4-s)}</p><p>Tempo usado: ${fmt(TOT-T)}. Pontuação: <strong>${pts}</strong>. Título: ${rk}. Recorde: ${rec}.<br>Conquistas: ${ach.join(', ')||'nenhuma desta vez'}.<br>${H} dica(s) e ${E} erro(s). Estrelas: metade do tempo restante, no máximo 1 dica e no máximo 3 erros.</p>${rkh(top)}<div class="note" style="display:flex;gap:10px;align-items:center">${av('Helena','h',56)}<span><b class="c">Dra. Helena:</b> Você salvou anos de pesquisa, ${NOME}. Obrigada por me ajudar, de verdade.</span></div><div class="note" style="display:flex;gap:10px;align-items:center">${av('Tico','h',56)}<span><b class="r">Tico:</b> Missão cumprida. Você é um ótimo parceiro de laboratório!</span></div><button class="go" id="again">Jogar novamente</button></div>`
 :`<div class="stage hero" style="margin-top:20px">${rx()}<h1 style="font-size:2.6rem">O tempo acabou</h1><p>A energia de reserva falhou e o laboratório entrou em modo de segurança. Você reuniu ${got.length} de 5 peças.</p><div class="note" style="display:flex;gap:10px;align-items:center">${av('Tico','w',56)}<span><b class="r">Tico:</b> Ainda dá tempo de tentar outra vez. Eu lembro onde cada peça está.</span></div><button class="go" id="again">Tentar novamente</button></div>`;
 $('#again').onclick=intro;if(win){confetti();[523,659,784,1047].forEach((f,i)=>setTimeout(()=>beep(f,.3,'sine'),i*150))}}
function intro(){clearInterval(tick);document.body.classList.remove('alert','out');$('#app').innerHTML=`<div class="stage hero" style="margin-top:20px">${rx()}<h1 class="glitch" style="font-size:2.4rem"><span class="lamp"></span>O Laboratório Secreto</h1><p>Um cientista criou uma máquina que parou de funcionar. Você tem <strong id="tt">10 minutos</strong> para entrar no laboratório, resolver os desafios de cada sala, recuperar as 5 peças, montar a máquina e ligá-la.</p><div class="cast"><div>${av('Eu','h',56)}<span><b>Você</b><br>Explorador(a) de capacete com lanterna. Corajoso, mas sem pressa não vai dar.</span></div><div>${av('Helena','n',56)}<span><b>Dra. Helena Duarte</b><br>Cientista de 58 anos, criadora da máquina. Séria, mas se preocupa com todos.</span></div><div>${av('Tico','h',56)}<span><b>Tico</b><br>Robô ajudante, curioso e bem-humorado. Cada dica custa tempo.</span></div></div>${rkh()}<div class="row" id="df"><button data-d="0">Fácil, 12 min</button><button data-d="1" class="go">Normal, 10 min</button><button data-d="2">Difícil, 7 min</button></div><p class="note" id="dd">Normal: 10 minutos, cada dica custa 20 s e a pontuação vale 100%.</p><p class="note">Como jogar: abra as salas pelo mapa, resolva o desafio de cada uma e pegue a peça. Depois monte a máquina na ordem certa.</p><div class="row"><input id="nm" autocomplete="off" maxlength="14" placeholder="Seu nome" style="text-transform:none" aria-label="Seu nome"><button class="go" id="s">Entrar no laboratório</button></div></div>`;document.querySelectorAll('#df button').forEach(b=>b.onclick=()=>{const d=+b.dataset.d;TOT=[720,600,420][d];HC=[10,20,30][d];$('#tt').textContent=TOT/60+' minutos';$('#dd').textContent=['Fácil: 12 minutos, cada dica custa 10 s e a pontuação vale 80%.','Normal: 10 minutos, cada dica custa 20 s e a pontuação vale 100%.','Difícil: 7 minutos, cada dica custa 30 s e a pontuação vale 130%.'][d];document.querySelectorAll('#df button').forEach(x=>x.classList.toggle('go',x===b))});$('#nm').onkeydown=e=>e.key==='Enter'&&$('#s').click();$('#s').onclick=()=>{NOME=($('#nm').value.trim()||'Explorador(a)').slice(0,14).replace(/[<>&"]/g,'');start()}}
document.addEventListener('keydown',e=>{const i=$('#in')||$('#nm');if(!i||document.activeElement===i||e.ctrlKey||e.metaKey||e.altKey)return;if(e.key==='Enter'){($('#ok')||$('#s')).click();return}if(e.key==='Backspace'){i.value=i.value.slice(0,-1);e.preventDefault();return}if(e.key.length===1&&i.value.length<i.maxLength){if(i.inputMode==='numeric'&&!/\d/.test(e.key))return;i.value+=e.key;e.preventDefault()}});
intro();
</script>
